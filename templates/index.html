<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Karan Jadhav</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <style>
        body{background-color: #eff2f9;}
        .iupload h3{color: #1b2d6b;font-size: 30px;font-weight: 700;}
        .img-part{height:300px;width:300px;margin:0px auto;}
        .image-part{height:300px;width:300px;border:1px solid #1b2d6b;}
        .image-part img{position:absolute;height: 300px;width:300px;display:none;padding:5px;}
        .image-part #video{display:block;height: 300px;width:300px;padding:5px;}
        .res-part{border:1px solid #dedede;height: 310px;width:100%;padding:5px;margin:0px auto;overflow:auto; display: flex; align-items: center; justify-content: center;}
        .res-part2{border:1px solid #dedede;height: 310px;width:100%;padding:5px;margin:0px auto; display: flex; align-items: center; justify-content: center;}
        .resp-img{height: 298px;width: 233px;margin:0px auto;}
        .jsonRes{margin-left:30px; font-size: 18px; font-weight: bold; text-align: center;}
        #send{cursor:pointer;}
        .btn-part{width:325px;}
        textarea,
        select,
        .form-control,
        .custom-select,
        button.btn,
        .btn-primary,
        input[type="text"],
        input[type="url"],
        .uneditable-input{
            border: 1px solid #363e75;
            outline: 0 !important;
            border-radius:0px;
            box-shadow: none;
           -webkit-box-shadow: none;
           -moz-box-shadow: none;
           -moz-transition: none;
           -webkit-transition: none;
        }
        textarea:focus,
        select:focus,
        .form-control:focus,
        .btn:focus,
        .btn-primary:focus,
        .custom-select:focus,
        input[type="text"]:focus,
        .uneditable-input:focus{
            border: 1px solid #007bff;
            outline: 0 !important;
            border-radius:0px;
            box-shadow: none;
           -webkit-box-shadow: none;
           -moz-box-shadow: none;
           -moz-transition: none;
           -webkit-transition: none;
        }
        #loading {
            position: fixed;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100%;
            z-index: 9999999999;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.7);
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #363e75;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            left: 50%;
            margin-left: -4em;
            display: block;
            animation: spin 2s linear infinite;
        }
        .loader,
        .loader:after {display: block;position: absolute;top: 50%;margin-top: -4.05em;}
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .right-part{border:1px solid #dedede;padding:5px;}
        .logo{position:absolute;right:0px;bottom:0px;margin-right:30px;margin-bottom:30px;}
        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .prediction-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .similar-images-container {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #dedede;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .similar-images-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .similar-images-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .similar-image-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .similar-image-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .similar-image-item .image-label {
            margin-top: 5px;
            font-size: 12px;
            text-align: center;
        }
        .similar-images-controls {
            margin-top: 15px;
            text-align: center;
        }
        #similarImagesSection {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main container">
        <section class="iupload">
            <h3 class="text-center py-4">Object Classification</h3>
            <div class="row">
                <div class="img-part col-md-6">
                    <div class="image-part">
                        <video autoplay id="video" poster="https://img.freepik.com/free-vector/group-young-people-posing-photo_52683-18824.jpg?size=338&ext=jpg"></video>
                        <img src="" id="photo">
                        <canvas style="display:none;" id="canvas"></canvas>
                    </div>
                    <div class="btn-part">
                        <form id="upload-data pt-3" class="">
                            <div class="input-group mt-3 row">
                                <button type="button" class="btn btn-primary col-md-5 col-xs-5 ml-3 mr-4" id="uload">Upload</button>
                                <button id="send" type="button" class="btn btn-success col-md-5 col-xs-5">Predict</button>
                            </div>
                            <input type="hidden" class="form-control mr-3" id="url" placeholder="Enter REST Api url..." value="../predict"/>
                            <input name="upload" type="file" id="fileinput" style="position:absolute;top:-500px;"/><br/>
                        </form>
                    </div>
                </div>
                <div class="col-md-6 col-xs-12 right-part">
                    <h2 class="mb-2"><center>Prediction Result</center></h2>
                    <div class="row">
                        <div class="res-part2 col-md-6 col-xs-12">
                            <!-- Input image will be displayed here -->
                        </div>
                        <div class="res-part col-md-6 col-xs-12">
                            <div class="result-container">
                                <div class="prediction-text">Prediction:</div>
                                <div class="jsonRes"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Similar Images Section -->
                    <div id="similarImagesSection" class="similar-images-container">
                        <div class="similar-images-title">Similar Images</div>
                        <div id="similarImagesGrid" class="similar-images-grid"></div>
                        <div class="similar-images-controls">
                            <button id="showMoreBtn" class="btn btn-info btn-sm">Show More</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal for similar images prompt -->
    <div class="modal fade" id="similarImagesModal" tabindex="-1" role="dialog" aria-labelledby="similarImagesModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="similarImagesModalLabel">Find Similar Images</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Would you like to see similar images to your prediction?</p>
                    <div class="form-group">
                        <label for="numImagesInput">Number of similar images to display:</label>
                        <input type="number" class="form-control" id="numImagesInput" min="1" max="20" value="5">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                    <button type="button" class="btn btn-primary" id="confirmSimilarImages">Yes</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading"><div class="loader"></div></div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <script>
    var mybtn = document.getElementById('startbtn');
    var myvideo = document.getElementById('video');
    var mycanvas = document.getElementById('canvas');
    var myphoto = document.getElementById('photo');
    var base_data = "";
    var currentPrediction = "";

    function sendRequest(base64Data){
        var type = "json";
        if(base64Data != "" || base64Data != null){
            if(type == "imgtobase"){
                $(".res-part").html("");
                $(".res-part").html(base64Data);
            }
            else if(type == "basetoimg"){
                var imageData = $("#imgstring").val();
                $(".res-part").html("");
                $(".res-part").append("<img src='data:image/jpeg;base64," + imageData + "' alt='' />");
            }
            else{
                var url = $("#url").val();
                $("#loading").show();
                $.ajax({
                    url : url,
                    type: "post",
                    cache: false,
                    async: true,
                    crossDomain: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin':'*'
                    },
                    data:JSON.stringify({image:base64Data}),
                    success: function(res){
                        $(".res-part").html("");
                        $(".res-part2").html("");
                        try{
                            // Display input image in left rectangle
                            var inputImage = $('#photo').attr('src');
                            $(".res-part2").append("<img class='resp-img' src='" + inputImage + "' alt='Input Image' />");
                           
                            // Display prediction results in right rectangle
                            if(res && res[0]) {
                                currentPrediction = res[0];
                                var predictionHTML = '<div class="result-container">';
                                predictionHTML += '<div class="prediction-text">Prediction:</div>';
                                predictionHTML += '<pre style="font-size: 18px;">' + JSON.stringify(res[0], undefined, 2) + '</pre>';
                                predictionHTML += '</div>';
                                $(".res-part").html(predictionHTML);
                                
                                // Ask if user wants to see similar images
                                $('#similarImagesModal').modal('show');
                            } else {
                                $(".res-part").html('<div class="result-container"><div class="prediction-text">No prediction results</div></div>');
                            }
                        } catch(e) {
                            console.error("Error processing response:", e);
                            $(".res-part").html('<div class="result-container"><div class="prediction-text">Error processing results</div></div>');
                        }
                        $("#loading").hide();
                    },
                    error: function(xhr, status, error) {
                        $(".res-part").html('<div class="result-container"><div class="prediction-text">Error: ' + error + '</div></div>');
                        $("#loading").hide();
                    }
                });
            }
        }
    }

    function loadSimilarImages(numImages) {
        $("#loading").show();
        
        $.ajax({
            url: "/get_similar_images",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                num_images: numImages
            }),
            success: function(response) {
                if (response.success) {
                    displaySimilarImages(response.similar_images);
                } else {
                    $('#similarImagesGrid').html('<p>Error: ' + response.message + '</p>');
                    $('#similarImagesSection').show();
                }
                $("#loading").hide();
            },
            error: function(xhr, status, error) {
                $('#similarImagesGrid').html('<p>Error loading similar images: ' + error + '</p>');
                $('#similarImagesSection').show();
                $("#loading").hide();
            }
        });
    }

    function displaySimilarImages(images) {
        var grid = $('#similarImagesGrid');
        grid.empty();
        
        if (!images || images.length === 0) {
            grid.html('<p>No similar images found in database</p>');
            $('#similarImagesSection').show();
            return;
        }
        
        images.forEach(function(imgPath, index) {
            // Clean up path and ensure proper URL
            let cleanPath = imgPath.replace(/^\/+/, ''); // Remove leading slashes
            cleanPath = cleanPath.replace(/ /g, '%20'); // Handle spaces in filenames
            
            // Create the image URL
            var imgUrl = '/static/' + cleanPath;
            
            grid.append(`
                <div class="similar-image-item">
                    <img src="${imgUrl}" alt="Similar image ${index + 1}" 
                         onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
                    <span class="image-label">Similar ${index + 1}</span>
                </div>
            `);
        });
        
        $('#similarImagesSection').show();
    }


    $(document).ready(function(){
        $("#loading").hide();

        $('#send').click(function(evt){
            sendRequest(base_data);
        });

        $('#uload').click(function(evt) {
            $('#fileinput').focus().trigger('click');
        });
       
        $("#fileinput").change(function(){
            if (this.files && this.files[0]){
                var reader = new FileReader();
                reader.onload = function (e){
                    var url = e.target.result;
                    var img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = function(){
                        var canvas = document.createElement('CANVAS');
                        var ctx = canvas.getContext('2d');
                        canvas.height = this.height;
                        canvas.width = this.width;
                        ctx.drawImage(this, 0, 0);
                        base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                        canvas = null;
                    };
                    img.src = url;
                    $('#photo').attr('src', url);
                    $('#photo').show();
                    $('#video').hide();
                   
                    // Clear previous results when new image is uploaded
                    $(".res-part").html('<div class="result-container"><div class="prediction-text">Prediction</div></div>');
                    $(".res-part2").html("Uploaded");
                    $('#similarImagesSection').hide();
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        // Handle similar images confirmation
        $('#confirmSimilarImages').click(function() {
            var numImages = $('#numImagesInput').val();
            if (numImages < 1) numImages = 1;
            if (numImages > 20) numImages = 20;
            
            $('#similarImagesModal').modal('hide');
            loadSimilarImages(numImages);
        });

        // Show more similar images
        $('#showMoreBtn').click(function() {
            var currentCount = $('#similarImagesGrid .similar-image-item').length;
            loadSimilarImages(currentCount + 5);
        });
    });
    </script>
</body>
</html>
