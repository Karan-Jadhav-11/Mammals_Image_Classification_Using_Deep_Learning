<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Mammal Classification</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #6366f1;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .main-container {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .header-title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -1px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-preview-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            position: relative;
            margin-bottom: 25px;
        }

        .image-preview-container img, .image-preview-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-custom {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
            color: white;
        }

        .btn-success-custom {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-success-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
            color: white;
        }

        .result-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .prediction-box {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .prediction-label {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .prediction-value {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .similar-images-container {
            margin-top: 30px;
            background: var(--glass);
            border-radius: 20px;
            padding: 20px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .similar-item {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .similar-item:hover {
            transform: scale(1.05);
        }

        .similar-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .modal-content {
            background: #1e293b;
            color: white;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }

        .modal-header { border-bottom: 1px solid var(--glass-border); }
        .modal-footer { border-top: 1px solid var(--glass-border); }
        
        .form-control {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(0,0,0,0.3);
            color: white;
            border-color: var(--primary);
            box-shadow: none;
        }

    </style>
</head>
<body>
    <div id="loading"><span class="loader"></span></div>
    
    <div class="container main-container">
        <h1 class="header-title">Mammal Classification</h1>
        
        <div class="row g-4">
            <!-- Left Side: Upload -->
            <div class="col-lg-6">
                <div class="glass-card h-100">
                    <div class="upload-section">
                        <div class="image-preview-container">
                            <video autoplay id="video" poster="https://img.freepik.com/free-vector/group-young-people-posing-photo_52683-18824.jpg?size=338&ext=jpg"></video>
                            <img src="" id="photo" style="display:none;">
                            <canvas style="display:none;" id="canvas"></canvas>
                        </div>
                        
                        <div class="d-flex gap-3 mt-2 w-100 justify-content-center">
                            <button type="button" class="btn btn-custom btn-primary-custom mx-2" id="uload">Upload Image</button>
                            <button id="send" type="button" class="btn btn-custom btn-success-custom mx-2">Predict Species</button>
                        </div>
                        
                        <input type="hidden" id="url" value="../predict"/>
                        <input name="upload" type="file" id="fileinput" style="display:none;"/>
                    </div>
                </div>
            </div>

            <!-- Right Side: Results -->
            <div class="col-lg-6">
                <div class="glass-card h-100 result-panel">
                    <h2 class="result-title">Analysis Results</h2>
                    
                    <div class="row h-100">
                        <div class="col-md-5 mb-3 mb-md-0">
                            <div id="inputImagePreview" class="prediction-box" style="padding: 10px;">
                                <span class="prediction-label">Input Image</span>
                                <div class="res-part2" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                                    <p class="text-muted">No image uploaded</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="prediction-box">
                                <span class="prediction-label">Detected Species</span>
                                <div class="res-part">
                                    <div class="prediction-value">---</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Similar Images Section -->
                    <div id="similarImagesSection">
                        <div class="similar-images-container mt-4">
                            <div class="d-flex justify-content-between align-items: center; margin-bottom: 10px;">
                                <h5 class="mb-0" style="font-weight: 600;">Similar Matches</h5>
                                <button id="showMoreBtn" class="btn btn-link btn-sm p-0 text-info">View More</button>
                            </div>
                            <div id="similarImagesGrid" class="similar-grid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <script>
    var mybtn = document.getElementById('startbtn');
    var myvideo = document.getElementById('video');
    var mycanvas = document.getElementById('canvas');
    var myphoto = document.getElementById('photo');
    var base_data = "";
    var currentPrediction = "";

    function sendRequest(base64Data){
        var type = "json";
        if(base64Data != "" || base64Data != null){
            if(type == "imgtobase"){
                $(".res-part").html("");
                $(".res-part").html(base64Data);
            }
            else if(type == "basetoimg"){
                var imageData = $("#imgstring").val();
                $(".res-part").html("");
                $(".res-part").append("<img src='data:image/jpeg;base64," + imageData + "' alt='' />");
            }
            else{
                var url = $("#url").val();
                $("#loading").show();
                $.ajax({
                    url : url,
                    type: "post",
                    cache: false,
                    async: true,
                    crossDomain: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin':'*'
                    },
                    data:JSON.stringify({image:base64Data}),
                    success: function(res){
                        $(".res-part").html("");
                        $(".res-part2").html("");
                        try{
                            // Display input image in left rectangle
                            var inputImage = $('#photo').attr('src');
                            $(".res-part2").append("<img class='resp-img' src='" + inputImage + "' alt='Input Image' style='max-width:100%; border-radius:12px;' />");
                           
                            // Display prediction results
                            if(res && res[0]) {
                                currentPrediction = res[0];
                                // Extract class name if the response is an object or string
                                let displayVal = (typeof res[0] === 'object') ? (res[0].image || JSON.stringify(res[0])) : res[0];
                                
                                var predictionHTML = '<div class="prediction-value">' + displayVal + '</div>';
                                $(".res-part").html(predictionHTML);
                                
                                // Ask if user wants to see similar images
                                $('#similarImagesModal').modal('show');
                            } else {
                                $(".res-part").html('<div class="text-muted">No result</div>');
                            }
                        } catch(e) {
                            console.error("Error processing response:", e);
                            $(".res-part").html('<div class="text-danger">Error</div>');
                        }
                        $("#loading").hide();
                    },
                    error: function(xhr, status, error) {
                        $(".res-part").html('<div class="text-danger">Error: ' + error + '</div>');
                        $("#loading").hide();
                    }
                });
            }
        }
    }

    function loadSimilarImages(numImages) {
        $("#loading").show();
        
        $.ajax({
            url: "/get_similar_images",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                num_images: numImages
            }),
            success: function(response) {
                if (response.success) {
                    displaySimilarImages(response.similar_images);
                } else {
                    $('#similarImagesGrid').html('<p class="text-danger">Error: ' + response.message + '</p>');
                    $('#similarImagesSection').show();
                }
                $("#loading").hide();
            },
            error: function(xhr, status, error) {
                $('#similarImagesGrid').html('<p class="text-danger">Error loading images</p>');
                $('#similarImagesSection').show();
                $("#loading").hide();
            }
        });
    }

    function displaySimilarImages(images) {
        var grid = $('#similarImagesGrid');
        grid.empty();
        
        if (!images || images.length === 0) {
            grid.html('<p class="text-muted">No similar matches found</p>');
            $('#similarImagesSection').show();
            return;
        }
        
        images.forEach(function(imgPath, index) {
            let cleanPath = imgPath.replace(/^\/+/, '');
            cleanPath = cleanPath.replace(/ /g, '%20');
            var imgUrl = '/static/' + cleanPath;
            
            grid.append(`
                <div class="similar-item">
                    <img src="${imgUrl}" alt="Match ${index + 1}" 
                         onerror="this.src='https://via.placeholder.com/150?text=Not+Found'">
                </div>
            `);
        });
        
        $('#similarImagesSection').show();
    }


    $(document).ready(function(){
        $("#loading").hide();

        $('#send').click(function(evt){
            sendRequest(base_data);
        });

        $('#uload').click(function(evt) {
            $('#fileinput').focus().trigger('click');
        });
       
        $("#fileinput").change(function(){
            if (this.files && this.files[0]){
                var reader = new FileReader();
                reader.onload = function (e){
                    var url = e.target.result;
                    var img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = function(){
                        var canvas = document.createElement('CANVAS');
                        var ctx = canvas.getContext('2d');
                        canvas.height = this.height;
                        canvas.width = this.width;
                        ctx.drawImage(this, 0, 0);
                        base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                        canvas = null;
                    };
                    img.src = url;
                    $('#photo').attr('src', url);
                    $('#photo').show();
                    $('#video').hide();
                   
                    // Clear previous results when new image is uploaded
                    $(".res-part").html('<div class="result-container"><div class="prediction-text">Prediction</div></div>');
                    $(".res-part2").html("Uploaded");
                    $('#similarImagesSection').hide();
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        // Handle similar images confirmation
        $('#confirmSimilarImages').click(function() {
            var numImages = $('#numImagesInput').val();
            if (numImages < 1) numImages = 1;
            if (numImages > 20) numImages = 20;
            
            $('#similarImagesModal').modal('hide');
            loadSimilarImages(numImages);
        });

        // Show more similar images
        $('#showMoreBtn').click(function() {
            var currentCount = $('#similarImagesGrid .similar-image-item').length;
            loadSimilarImages(currentCount + 5);
        });
    });
    </script>
</body>
</html>
