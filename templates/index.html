    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        :root {
            --bg-body: #111827; /* Dark navy/slate background */
            --bg-panel: #1F2937; /* Lighter slate for panels */
            --bg-box: #111827; /* Dark background for inner boxes */
            
            --text-title: #818CF8; /* Light purple/blue for main title */
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            
            --btn-blue: #6366F1; /* Upload button */
            --btn-blue-hover: #4F46E5;
            --btn-green: #10B981; /* Predict button */
            --btn-green-hover: #059669;
            
            --result-text: #60A5FA; /* Blue text for prediction result */
            
            --border-color: rgba(255,255,255,0.05);
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 10px 30px rgba(129, 140, 248, 0.2);
        }

        .app-container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .panel {
            background-color: var(--bg-panel);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 350px;
            display: flex;
            flex-direction: column;
        }

        .image-preview-container {
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #E5E7EB;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-container img, .image-preview-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #E5E7EB;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: auto;
        }

        .btn-custom {
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-upload {
            background-color: var(--btn-blue);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }
        .btn-upload:hover {
            background-color: var(--btn-blue-hover);
        }

        .btn-predict {
            background-color: var(--btn-green);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        .btn-predict:hover {
            background-color: var(--btn-green-hover);
        }

        /* Right Panel - Results */
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .result-box {
            background-color: var(--bg-box);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .box-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .prediction-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--result-text);
            text-align: center;
            word-break: break-word;
            margin: auto 0;
        }

        /* Similar Images Section */
        #findSimilarBtn {
            margin-top: 30px;
            background-color: transparent;
            border: 2px solid var(--btn-blue);
            color: var(--btn-blue);
            width: 100%;
        }
        #findSimilarBtn:hover {
            background-color: rgba(99, 102, 241, 0.1);
        }

        #similarImagesSection {
            display: none;
            margin-top: 30px;
            background-color: var(--bg-box);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .similar-item {
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background-color: #2D3748;
        }

        .similar-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Loader */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(17, 24, 39, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-bottom-color: var(--btn-blue);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal styling */
        .modal-content {
            background-color: var(--bg-panel);
            color: white;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal-header { 
            border-bottom: 1px solid var(--border-color); 
            padding: 24px 30px;
        }
        .modal-body {
            padding: 30px;
        }
        .modal-footer { 
            border-top: 1px solid var(--border-color); 
            padding: 20px 30px;
        }
        .form-control {
            background-color: var(--bg-box);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background-color: var(--bg-box);
            color: white;
            border-color: var(--btn-blue);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }
        .close { 
            color: white; 
            text-shadow: none; 
            opacity: 0.8;
            transition: 0.2s;
        }
        .close:hover { 
            color: white; 
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading"><span class="loader"></span></div>
    
    <h1 class="header-title">Mammal Classification</h1>

    <div class="app-container">
        <!-- Left Panel -->
        <div class="panel">
            <div class="image-preview-container">
                <video autoplay id="video" poster="/static/collage.jpg"></video>
                <img src="" id="photo" style="display:none;">
                <canvas style="display:none;" id="canvas"></canvas>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-custom btn-upload" id="uload">UPLOAD IMAGE</button>
                <button id="send" type="button" class="btn-custom btn-predict">PREDICT SPECIES</button>
            </div>
            
            <input type="hidden" id="url" value="../predict"/>
            <input name="upload" type="file" id="fileinput" style="display:none;"/>
        </div>

        <!-- Right Panel -->
        <div class="panel">
            <div class="section-title">Analysis Results</div>
            
            <div class="results-grid">
                <!-- Input Image Box -->
                <div class="result-box">
                    <div class="box-label">Input Image</div>
                    <div class="thumbnail-container" id="inputThumbnail">
                        <span class="text-muted small" style="margin:auto">No image</span>
                    </div>
                </div>
                
                <!-- Prediction Box -->
                <div class="result-box">
                    <div class="box-label">Detected Species</div>
                    <div class="prediction-value" id="predictionResult">---</div>
                </div>
            </div>

            <button id="findSimilarBtn" class="btn-custom" style="display: none;">FIND SIMILAR MATCHES</button>

            <!-- Similar Images Section -->
            <div id="similarImagesSection">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h5 style="margin:0; font-size: 1rem; font-weight: 600;">Similar Matches</h5>
                    <button id="showMoreBtn" style="background:none; border:none; color:var(--btn-blue); font-size:0.85rem; cursor:pointer;">View More</button>
                </div>
                <div id="similarImagesGrid" class="similar-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="countModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold" style="font-size: 1.2rem;">Database Search</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p style="color: var(--text-muted); margin-bottom: 15px;">How many similar images would you like to retrieve?</p>
                    <div class="form-group mb-0">
                        <input type="number" class="form-control" id="imgCountInput" value="5" min="1" max="50">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn text-white" data-dismiss="modal" style="background-color: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 20px; font-weight: 600;">Cancel</button>
                    <button type="button" class="btn text-white" id="confirmCount" style="background-color: var(--btn-blue); border:none; border-radius: 10px; padding: 10px 24px; font-weight: 600; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);">Search</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <script>
    var myvideo = document.getElementById('video');
    var mycanvas = document.getElementById('canvas');
    var myphoto = document.getElementById('photo');
    var base_data = "";

    function sendRequest(base64Data){
        if(base64Data != "" || base64Data != null){
            var url = $("#url").val();
            $("#loading").show();
            $.ajax({
                url : url,
                type: "post",
                cache: false,
                async: true,
                crossDomain: true,
                headers: {
                    'Content-Type': 'application/json',
                    'Access-Control-Allow-Origin':'*'
                },
                data:JSON.stringify({image:base64Data}),
                success: function(res){
                    try{
                        var inputImage = $('#photo').attr('src');
                        $("#inputThumbnail").html("<img src='" + inputImage + "' alt='Input' />");
                        
                        if(res && res[0]) {
                            let displayVal = (typeof res[0] === 'object') ? (res[0].image || JSON.stringify(res[0])) : res[0];
                            $("#predictionResult").text(displayVal);
                            $('#findSimilarBtn').fadeIn();
                            
                            setTimeout(function() {
                                $('#countModal').modal('show');
                            }, 500);
                        } else {
                            $("#predictionResult").html('<span style="font-size:1rem;color:#EF4444;">No result</span>');
                        }
                    } catch(e) {
                        $("#predictionResult").html('<span style="font-size:1rem;color:#EF4444;">Error</span>');
                    }
                    $("#loading").hide();
                },
                error: function(xhr, status, error) {
                    $("#predictionResult").html('<span style="font-size:1rem;color:#EF4444;">Analysis Failed</span>');
                    $("#loading").hide();
                }
            });
        }
    }

    function loadSimilarImages(numImages) {
        $("#loading").show();
        $.ajax({
            url: "/get_similar_images",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ num_images: numImages }),
            success: function(response) {
                if (response.success) {
                    displaySimilarImages(response.similar_images);
                } else {
                    $('#similarImagesGrid').html('<p style="color:#EF4444;">Error: ' + response.message + '</p>');
                    $('#similarImagesSection').fadeIn();
                }
                $("#loading").hide();
            },
            error: function() {
                $('#similarImagesGrid').html('<p style="color:#EF4444;">Search Failed</p>');
                $('#similarImagesSection').fadeIn();
                $("#loading").hide();
            }
        });
    }

    function displaySimilarImages(images) {
        var grid = $('#similarImagesGrid');
        grid.empty();
        if (!images || images.length === 0) {
            grid.html('<p style="color:#9CA3AF;font-size:0.85rem;">No matches found</p>');
            $('#similarImagesSection').fadeIn();
            return;
        }
        images.forEach(function(imgPath, index) {
            let cleanPath = imgPath.replace(/^\/+/, '').replace(/ /g, '%20');
            var imgUrl = '/static/' + cleanPath;
            grid.append(`
                <div class="similar-item">
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                </div>
            `);
        });
        $('#similarImagesSection').fadeIn();
    }

    $(document).ready(function(){
        $("#loading").hide();

        $('#send').click(function(evt){
            sendRequest(base_data);
        });

        $('#uload').click(function(evt) {
            $('#fileinput').focus().trigger('click');
        });

        $('#findSimilarBtn').click(function() {
            $('#countModal').modal('show');
        });

        $('#showMoreBtn').click(function() {
            $('#countModal').modal('show');
        });

        $('#confirmCount').click(function() {
            var count = $('#imgCountInput').val();
            if (count < 1) count = 1;
            $('#countModal').modal('hide');
            loadSimilarImages(count);
        });

        $("#fileinput").change(function(){
            if (this.files && this.files[0]){
                var reader = new FileReader();
                reader.onload = function (e){
                    var url = e.target.result;
                    var img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = function(){
                        var canvas = document.createElement('CANVAS');
                        var ctx = canvas.getContext('2d');
                        canvas.height = this.height;
                        canvas.width = this.width;
                        ctx.drawImage(this, 0, 0);
                        base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                    };
                    img.src = url;
                    $('#photo').attr('src', url).show();
                    $('#video').hide();
                    $("#predictionResult").html('<span style="color: #9CA3AF;">---</span>');
                    $("#inputThumbnail").html('<img src="' + url + '" style="width:100%; height:100%; object-fit:contain; border-radius:8px;">');
                    $('#similarImagesSection').hide();
                    $('#findSimilarBtn').hide();
                }
                reader.readAsDataURL(this.files[0]);
            }
        });
    });
    </script>
</body>
</html>
